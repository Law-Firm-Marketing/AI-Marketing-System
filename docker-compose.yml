services:
  api:
    build: ./backend
    container_name: marketing_api
    ports:
      - '8000:8000'
    environment:
      - POSTGRES_URL=postgresql+psycopg2://marketing:marketing@postgres:5432/marketing
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  worker:
    build: ./backend
    container_name: marketing_worker
    command: celery -A core.orchestrator.tasks.celery_app worker --loglevel=info
    environment:
      - POSTGRES_URL=postgresql+psycopg2://marketing:marketing@postgres:5432/marketing
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  redis:
    image: redis:7-alpine
    container_name: marketing_redis
    ports:
      - '6379:6379'

  postgres:
    image: postgres:16-alpine
    container_name: marketing_postgres
    environment:
      - POSTGRES_USER=marketing
      - POSTGRES_PASSWORD=marketing
      - POSTGRES_DB=marketing
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
